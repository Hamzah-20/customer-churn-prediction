<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronos AI — Customer Churn Prediction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        .gap{
        margin: 15px 0 0 0 ;
        }
        :root {
            --ink: #0e0e0e;
            --ink-2: #3a3835;
            --ink-3: #7a7673;
            --surface: #faf8f5;
            --surface-2: #f0ece4;
            --surface-3: #e3ddd2;
            --accent: #c74b1f;
            --accent-light: #f9ede8;
            --accent-mid: #e8784f;
            --safe: #1a7a4a;
            --safe-light: #e4f4ec;
            --warn: #b58a00;
            --warn-light: #fdf4d6;
            --border: #ddd8cf;
            --card: #ffffff;
            --serif: 'DM Serif Display', serif;
            --sans: 'Instrument Sans', sans-serif;
            --mono: 'DM Mono', monospace;
            --r: 8px;
            --r-lg: 14px;
        }

        body { font-family: var(--sans); background: var(--surface); color: var(--ink); min-height: 100vh; font-size: 15px; line-height: 1.6; }
        .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
        .sidebar { background: var(--ink); color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 10; }
        .main { display: flex; flex-direction: column; overflow: hidden; }

        .logo-area { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-label { font-family: var(--serif); font-size: 19px; color: #fff; line-height: 1.2; }
        .logo-sub { font-size: 11px; color: rgba(255,255,255,0.45); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; font-family: var(--mono); }
        .nav { padding: 16px 12px; flex: 1; }
        .nav-section { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 0 12px; margin: 20px 0 8px; font-family: var(--mono); }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r); cursor: pointer; color: rgba(255,255,255,0.65); font-size: 14px; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; }
        .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.8; }
        .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .nav-item.active { background: rgba(199,75,31,0.25); color: #fff; font-weight: 500; }
        .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .topbar-title { font-family: var(--serif); font-size: 22px; color: var(--ink); }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .badge-alert { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; font-family: var(--mono); }
        .content { padding: 28px 32px; flex: 1; overflow-y: auto; }
        .page { display: none; }
        .page.active { display: block; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 20px; }
        .card-title { font-family: var(--serif); font-size: 17px; margin-bottom: 18px; color: var(--ink); border-left: 3px solid var(--accent); padding-left: 12px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-label { font-size: 12px; font-weight: 600; color: var(--ink-2); letter-spacing: 0.02em; }
        .form-input, .form-select { padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--r); font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--surface); outline: none; width: 100%; }
        .form-input:focus, .form-select:focus { border-color: var(--accent-mid); }
        .btn { background: var(--ink); color: #fff; border: none; border-radius: var(--r); font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; padding: 12px 24px; width: 100%; }
        .btn:hover { background: var(--accent); }
        .result-card { margin-top: 20px; padding: 20px; border-radius: var(--r-lg); display: none; border: 1px solid var(--border); background: var(--surface); }
        .result-card.show { display: block; animation: fadeIn 0.4s; }
        .probability-bar { background: var(--surface-2); border-radius: 20px; overflow: hidden; margin: 15px 0; height: 40px; }
        .probability-fill { background: linear-gradient(90deg, var(--accent), var(--accent-mid)); height: 100%; color: white; line-height: 40px; text-align: center; transition: width 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1); font-weight: bold; font-family: var(--mono); }
        .recommendation-box { background: var(--safe-light); border-left: 4px solid var(--safe); padding: 14px; border-radius: var(--r); margin-top: 16px; font-size: 13px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px; text-align: center; }
        .stat-card h3 { font-family: var(--serif); font-size: 32px; color: var(--ink); }
        .upload-area { border: 1.5px dashed var(--border); border-radius: var(--r-lg); padding: 40px; text-align: center; background: var(--surface); margin-bottom: 18px; }
        .results-table { overflow-x: auto; margin-top: 20px; }
        .results-table table { width: 100%; border-collapse: collapse; }
        .results-table th { background: var(--surface-2); font-family: var(--mono); font-size: 11px; padding: 12px; text-align: center; }
        .results-table td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 30px; font-size: 11px; font-weight: 600; font-family: var(--mono); }
        .badge-high { background: var(--accent-light); color: var(--accent); }
        .badge-medium { background: var(--warn-light); color: var(--warn); }
        .badge-low { background: var(--safe-light); color: var(--safe); }

        .small-insights-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 16px; }
        .small-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 10px 12px; transition: transform 0.2s; }
        .small-card:hover { transform: translateY(-2px); border-color: var(--accent-mid); }
        .small-card h3 { font-size: 14px; margin-bottom: 4px; }
        .small-card .card-desc { font-size: 10px; color: var(--ink-3); margin-bottom: 6px; }
        .small-card img { width: 100%; border-radius: var(--r); margin-top: 6px; border: 1px solid var(--surface-2); cursor: pointer; }
        .full-width-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 20px 24px; margin-top: 20px; }
        .full-width-card img { width: 100%; max-height: 550px; object-fit: contain; border-radius: var(--r); cursor: pointer; }

        .loading { text-align: center; margin: 30px 0; display: none; }
        .loading.show { display: block; }
        .spinner { border: 3px solid var(--surface-2); border-top: 3px solid var(--accent); border-radius: 50%; width: 48px; height: 48px; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(5px); }
        .image-modal.active { display: flex; }
        .modal-inner img { max-width: 90vw; max-height: 85vh; border-radius: 12px; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .close-modal:hover { background: var(--accent); }

        @media (max-width: 768px) { .small-insights-grid { grid-template-columns: 1fr; } .content { padding: 20px; } }
    </style>
</head>
<body>
<div class="shell">
    <nav class="sidebar">
        <div class="logo-area">
            <div class="logo-label">Chronos<br>AI</div>
            <div class="logo-sub">Churn Intelligence</div>
        </div>
        <div class="nav">
            <div class="nav-section">Core</div>
            <button class="nav-item active" onclick="switchTab('single')">Single Prediction</button>
            <button class="nav-item" onclick="switchTab('batch')">Batch Upload</button>
            <div class="nav-section">Insights</div>
            <button class="nav-item" onclick="switchTab('insights')">Analytics & Drivers</button>
        </div>
    </nav>

    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="pageTitle">Single Prediction</div>
        </div>
        <div class="content">
            <div id="singleTab" class="page active">
                <div class="card">
                    <div class="card-title">Customer 360° Profile</div>
                    <div id="dynamicFormContainer"><div class="loading show"><div class="spinner"></div><p>Loading form fields...</p></div></div>
                    <div id="singleLoading" class="loading"><div class="spinner"></div><p>Analyzing...</p></div>
                    <div id="singleResult" class="result-card">
                        <div style="display: flex; justify-content: space-between;">
                            <h3 style="font-family: var(--serif);">Churn Propensity Score</h3>
                            <span id="predictionTag" class="badge"></span>
                        </div>
                        <div class="probability-bar">
                            <div id="probFill" class="probability-fill" style="width: 0%">0%</div>
                        </div>
                        <p>
                            <strong>Probability:</strong>
                            <span id="probabilityVal">0</span>
                            % | <strong>Risk:</strong>
                            <span id="riskLevelSpan">—</span>
                        </p>
                        <div id="recommendationDiv" class="recommendation-box">

                        </div>
                    </div>
                </div>
            </div>

            <div id="batchTab" class="page">
                <div class="card">
                    <div class="card-title">CSV Batch Intelligence</div>
                    <div class="upload-area">
                        <input type="file" id="csvFile" accept=".csv" style="display: none;">
                        <button id="uploadBtn" class="btn" style="background: var(--surface); color: var(--ink); border: 1px solid var(--border); width: auto; padding: 10px 28px;">📂 Select CSV File</button>
                        <span id="fileName" style="margin-left: 15px; font-size: 13px; color: var(--ink-3);"></span>
                    </div>
                    <div id="batchResultArea" style="display: none;">
                        <div id="batchStats" class="stats-grid"></div>
                        <div style="text-align: center;"><img id="batchChartImg" style="max-width: 100%; border-radius: var(--r-lg);"></div>
                        <div class="flex-between"><button id="downloadCsvBtn" class="btn" style="background: var(--safe); width: auto;">⬇ Download Results</button></div>
                        <div id="batchTable" class="results-table"></div>
                    </div>
                </div>
            </div>

            <div id="insightsTab" class="page">
                <div class="card">
                    <div class="card-title">Root Cause & Model Diagnostics</div>
                    <div id="insightsGrid" class="small-insights-grid"><div class="small-card"><h3>Loading...</h3></div></div>
                </div>
                <div id="perfGrid"></div>
            </div>
        </div>
    </div>
</div>

<div id="imageModal" class="image-modal" onclick="closeModal()">
    <div class="close-modal" onclick="closeModal()">✕</div>
    <div class="modal-inner" onclick="event.stopPropagation()">
        <img id="modalImage" src="">
        <div id="modalCaption" class="modal-caption"></div>
    </div>
</div>

<script>
    let dynamicFields = [];

    function openModal(src, title) {
        document.getElementById('modalImage').src = src;
        document.getElementById('modalCaption').innerText = title || 'Chronos AI Insight';
        document.getElementById('imageModal').classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeModal() { document.getElementById('imageModal').classList.remove('active'); document.body.style.overflow = ''; }

    async function buildDynamicForm() {
        try {
            const res = await fetch('/form_fields');
            const data = await res.json();
            if (data.success && data.fields) {
                dynamicFields = data.fields;
                let html = '<form id="predictionForm"><div class="form-grid">';
                for (const f of dynamicFields) {
                    html += `<div class="form-group"><label class="form-label">${f.label}</label>`;
                    if (f.type === 'number') html += `<input type="number" name="${f.name}" class="form-input" value="${f.name === 'tenure' ? 12 : f.name === 'MonthlyCharges' ? 70 : f.name === 'TotalCharges' ? 840 : 0}">`;
                    else {
                        html += `<select name="${f.name}" class="form-select">`;
                        for (const opt of (f.options || ['Yes', 'No'])) html += `<option value="${opt}">${opt}</option>`;
                        html += `</select>`;
                    }
                    html += `</div>`;
                }






                html += `</div><button type="submit" class="btn gap">Predict Churn Risk</button></form>`;
                document.getElementById('dynamicFormContainer').innerHTML = html;
                document.getElementById('predictionForm').addEventListener('submit', handleSubmit);
            }
        } catch(e) { console.error(e); document.getElementById('dynamicFormContainer').innerHTML = '<div class="card">Error loading form</div>'; }
    }

    async function handleSubmit(e) {
        e.preventDefault();
        document.getElementById('singleLoading').classList.add('show');
        document.getElementById('singleResult').classList.remove('show');
        const data = Object.fromEntries(new FormData(e.target));
        try {
            const res = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            const r = await res.json();
            if (r.success) {
                document.getElementById('probabilityVal').innerText = r.churn_probability + '%';
                document.getElementById('probFill').style.width = r.churn_probability + '%';
                document.getElementById('probFill').innerText = r.churn_probability + '%';
                document.getElementById('predictionTag').innerHTML = r.prediction === 'Will Churn' ? '<span class="badge badge-high">Will Churn</span>' : '<span class="badge badge-low">✅ Will Stay</span>';
                let riskHtml = r.risk_level.includes('High') ? '<span class="badge badge-high">' + r.risk_level + '</span>' : (r.risk_level.includes('Medium') ? '<span class="badge badge-medium">' + r.risk_level + '</span>' : '<span class="badge badge-low">' + r.risk_level + '</span>');
                document.getElementById('riskLevelSpan').innerHTML = riskHtml;
                document.getElementById('recommendationDiv').innerHTML = `<strong>Retention Strategy</strong><br>${r.recommendation}`;
                document.getElementById('singleResult').classList.add('show');
            } else alert('Error: ' + r.error);
        } catch(err) { alert('Server error'); }
        finally { document.getElementById('singleLoading').classList.remove('show'); }
    }

    function switchTab(tab) {
        ['single', 'batch', 'insights'].forEach(t => document.getElementById(t + 'Tab').classList.remove('active'));
        document.getElementById(tab + 'Tab').classList.add('active');
        document.getElementById('pageTitle').innerText = tab === 'single' ? 'Single Prediction' : (tab === 'batch' ? 'Batch Upload' : 'Analytics & Drivers');
        if (tab === 'insights') loadInsights();
    }

    document.getElementById('uploadBtn').onclick = () => document.getElementById('csvFile').click();
    document.getElementById('csvFile').onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        document.getElementById('fileName').innerText = file.name;
        const fd = new FormData();
        fd.append('file', file);
        document.getElementById('singleLoading').classList.add('show');
        try {
            const res = await fetch('/upload_batch', { method: 'POST', body: fd });
            const r = await res.json();
            if (r.success) {
                document.getElementById('batchResultArea').style.display = 'block';
                document.getElementById('batchStats').innerHTML = `
                    <div class="stat-card"><h3>${r.total_customers}</h3><p>Total</p></div>
                    <div class="stat-card"><h3 style="color:var(--accent);">${r.churn_count}</h3><p>At Risk</p></div>
                    <div class="stat-card"><h3 style="color:var(--safe);">${r.stay_count}</h3><p>Safe</p></div>
                    <div class="stat-card"><h3>${r.churn_percentage}%</h3><p>Risk Rate</p></div>`;
                if (r.chart_url) document.getElementById('batchChartImg').src = r.chart_url;
                let tableHtml = '<h3>Sample Results</h3><table><tr><th>#</th><th>ID</th><th>Prediction</th><th>Probability</th><th>Risk</th></tr>';
                r.results.forEach((row, i) => {
                    tableHtml += `<tr><td>${i+1}</td><td>${row.Customer_ID}</td><td><span class="badge ${row.Prediction === 'Will Churn' ? 'badge-high' : 'badge-low'}">${row.Prediction}</span></td><td>${row.Churn_Probability}%</td><td><span class="badge badge-${row.Risk_Level === 'High' ? 'high' : (row.Risk_Level === 'Medium' ? 'medium' : 'low')}">${row.Risk_Level}</span></td></tr>`;
                });
                tableHtml += '</table>';
                document.getElementById('batchTable').innerHTML = tableHtml;
                document.getElementById('downloadCsvBtn').onclick = () => window.location.href = '/download_results';
            } else alert('Error: ' + r.error);
        } catch(err) { alert('Upload failed'); }
        finally { document.getElementById('singleLoading').classList.remove('show'); }
    };

    async function loadInsights() {
    try {
        const res = await fetch('/insights');
        const images = await res.json();

        console.log('Received images from server:', images);

        const gridImageItems = [
            { key: 'shap_summary', title: 'SHAP Feature Impact', desc: 'Feature-level SHAP values showing contribution to model output' },
            { key: 'shap_importance', title: 'Feature Importance (SHAP)', desc: 'Average impact of each feature on model predictions' },
            { key: 'shap_waterfall', title: 'SHAP Waterfall Analysis', desc: 'Individual customer explanation - how each feature affects churn prediction' },
            { key: 'tenure_effect', title: 'Tenure Impact', desc: 'Churn rate decreases significantly as customer tenure increases' },
            { key: 'price_effect', title: 'Monthly Charges Effect', desc: 'Higher monthly charges are strongly correlated with higher churn' },
            { key: 'contract_effect', title: 'Contract Type Impact', desc: 'Month-to-month contracts have the highest churn risk' },
            { key: 'services_effect', title: 'Services Impact', desc: 'Having additional services like TechSupport reduces churn' }
        ];

        let gridHtml = '';
        for (const item of gridImageItems) {
            const imagePath = images[item.key];

            if (imagePath) {
                gridHtml += `
                    <div class="small-card">
                        <h3>${item.title}</h3>
                        <div class="card-desc">${item.desc}</div>
                        <img src="${imagePath}" onclick="openModal('${imagePath}', '${item.title}')" alt="${item.title}" loading="lazy">
                    </div>
                `;
            } else {
                console.warn(`Image not found for key: ${item.key}`);
            }
        }

        document.getElementById('insightsGrid').innerHTML = gridHtml;

        const confusionMatrixPath = images['confusion_matrix'];
        if (confusionMatrixPath) {
            document.getElementById('perfGrid').innerHTML = `
                <div class="full-width-card">
                    <h3>Model Performance (Confusion Matrix)</h3>
                    <p style="font-size: 13px; color: var(--ink-3); margin-bottom: 15px;">Accuracy of our model on test data</p>
                    <img src="${confusionMatrixPath}" onclick="openModal('${confusionMatrixPath}', 'Confusion Matrix - Model Performance')" style="width: 100%; max-height: 550px; object-fit: contain; border-radius: var(--r); cursor: pointer;">
                </div>
            `;
        } else {
            console.warn('Confusion matrix image not found');
            document.getElementById('perfGrid').innerHTML = '';
        }

    } catch(e) {
        console.error('Error loading insights:', e);
        document.getElementById('insightsGrid').innerHTML = '<div class="small-card"> Error loading analytics</div>';
        document.getElementById('perfGrid').innerHTML = '';
    }
}

    window.addEventListener('load', () => { buildDynamicForm(); });
    window.switchTab = switchTab;
    window.openModal = openModal;
    window.closeModal = closeModal;
</script>
</body>
</html>
